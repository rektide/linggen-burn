[package]
name = "linggen-llm"
version = { workspace = true }
authors = { workspace = true }
edition = { workspace = true }


[dependencies]
# Burn ML framework
burn = { version = "0.20.0-pre.6", default-features = false }
burn-ndarray = { version = "0.20.0-pre.6", optional = true }
burn-wgpu = { version = "0.20.0-pre.6", optional = true }
burn-cuda = { version = "0.20.0-pre.6", optional = true }
burn-candle = { version = "0.20.0-pre.6", optional = true }
burn-import = { version = "0.20.0-pre.6", features = ["safetensors"] }

# Tokenization
tokenizers = { version = "0.21", default-features = false, features = ["onig"] }

# Model downloading from Hugging Face
hf-hub = "0.4"

# Utilities
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
dirs = "5.0"
rand = "0.8"
chrono = "=0.4"
tracing = "0.1"

# Async
tokio = { version = "1.42", features = ["full"] }

[features]
default = ["ndarray"]

# Backend features
ndarray = ["burn/ndarray", "burn-ndarray"]
wgpu = ["burn/wgpu", "burn-wgpu"]
cuda = ["burn/cuda", "burn-cuda"]
candle = ["burn/candle", "burn-candle"]
